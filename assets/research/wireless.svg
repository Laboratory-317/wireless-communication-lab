<svg id="still" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
<title id="title">Формирование направленного луча</title><desc id="desc">Согласованная работа антенн усиливает сигнал в выбранном направлении</desc>
