ight="24" fill="#fff" stroke="#183841" stroke-width="2"/><text x="580" y="391" text-anchor="middle" font-style="italic">c₃</text><text x="400" y="427" text-anchor="middle" class="muted">Проверочные узлы: сумма связанных битов равна 0 по модулю 2</text><circle cx="0" cy="0" r="6" class="motion-dot" style="--x0:120px;--y0:210px;--x1:220px;--y1:350px;--motion-delay:0s"/><circle cx="0" cy="0" r="6" class="motion-dot" style="--x0:200px;--y0:210px;--x1:220px;--y1:350px;--motion-delay:0.6s"/><circle cx="0" cy="0" r="6" class="motion-dot" style="--x0:440px;--y0:210px;--x1:220px;--y1:350px;--motion-delay:1.2s"/><circle cx="0" cy="0" r="6" class="motion-dot" style="--x0:200px;--y0:210px;--x1:340px;--y1:350px;--motion-delay:1.7999999999999998s"/><circle cx="0" cy="0" r="6" class="motion-dot" style="--x0:280px;--y0:210px;--x1:340px;--y1:350px;--motion-delay:0s"/><circle cx="0" cy="0" r="6" class="motion-dot" style="--x0:520px;--y0:210px;--x1:340px;--y1:350px;--motion-delay:0.6s"/><circle cx="0" cy="0" r="6" class="motion-dot" style="--x0:280px;--y0:210px;--x1:460px;--y1:350px;--motion-delay:1.2s"/><circle cx="0" cy="0" r="6" class="motion-dot" style="--x0:360px;--y0:210px;--x1:460px;--y1:350px;--motion-delay:1.7999999999999998s"/><circle cx="0" cy="0" r="6" class="motion-dot" style="--x0:600px;--y0:210px;--x1:460px;--y1:350px;--motion-delay:0s"/><circle cx="0" cy="0" r="6" class="motion-dot" style="--x0:120px;--y0:210px;--x1:580px;--y1:350px;--motion-delay:0.6s"/><circle cx="0" cy="0" r="6" class="motion-dot" style="--x0:360px;--y0:210px;--x1:580px;--y1:350px;--motion-delay:1.2s"/><circle cx="0" cy="0" r="6" class="motion-dot" style="--x0:680px;--y0:210px;--x1:580px;--y1:350px;--motion-delay:1.7999999999999998s"/>
