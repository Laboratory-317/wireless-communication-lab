<svg id="still" class="edu-scene edu-ris" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
<title id="title">Управляемое отражение сигнала</title><desc id="desc">RIS создаёт дополнительный путь между передатчиком и приёмником</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#257664"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#183841;font-size:18px}path{fill:none;stroke:#183841;stroke-width:2}circle{fill:#fff;stroke:#183841;stroke-width:2}.muted{fill:#536c70;font-size:16px}.signal{stroke:#257664;stroke-width:3}.accent{fill:#257664}.head{font-size:27px;font-weight:700}.small{font-size:15px}
.edu-phase{opacity:0;animation-duration:12s;animation-timing-function:linear;animation-iteration-count:infinite}
.edu-one{animation-name:edu-one}.edu-two{animation-name:edu-two}.edu-three{animation-name:edu-three}
@keyframes edu-one{0%,28%{opacity:1}32%,100%{opacity:0}}
@keyframes edu-two{0%,32%{opacity:0}35%,61%{opacity:1}65%,100%{opacity:0}}
@keyframes edu-three{0%,65%{opacity:0}68%,96%{opacity:1}100%{opacity:0}}
.edu-wire{fill:none;stroke:#536c70;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.edu-box{fill:#fff;stroke:#183841;stroke-width:1.5}.edu-active{fill:none;stroke:#257664;stroke-width:3;stroke-linecap:round}
.edu-fill{fill:#257664;stroke:#257664;stroke-width:1}.edu-alt{fill:#b77538;stroke:#b77538;stroke-width:1}.edu-third{fill:#536c70;stroke:#536c70;stroke-width:1}
.edu-faint{opacity:.22}.edu-bad{fill:none;stroke:#be3b36;stroke-width:3}.edu-error{fill:#be3b36;stroke:#be3b36}
.edu-good{fill:#257664;stroke:#257664}.edu-white{fill:#fff;stroke:none;font:12px Arial,sans-serif}
.edu-caption{fill:#183841;stroke:none;font:600 17px Arial,sans-serif}.edu-bit{fill:#183841;stroke:none;font:16px Consolas,monospace}.edu-label{fill:#536c70;stroke:none;font:14px Arial,sans-serif}
.edu-lobe{fill:#257664;fill-opacity:.13;stroke:#257664;stroke-width:2}.edu-link{fill:none;stroke:#257664;stroke-width:2;stroke-dasharray:4 5}
.edu-draw{stroke-dasharray:100;stroke-dashoffset:100;animation:edu-reveal 12s linear infinite}
.edu-received{opacity:0;animation:edu-received 12s linear infinite}
@keyframes edu-received{0%,86%{opacity:0}89%,98%{opacity:1}100%{opacity:0}}
@keyframes edu-reveal{0%,68%{stroke-dashoffset:100}87%,100%{stroke-dashoffset:0}}
.edu-access .signal{opacity:.14}.edu-ris .signal{opacity:.2}
svg:target .edu-phase,svg:target .edu-draw,svg:target .edu-received{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.edu-phase,.edu-draw,.edu-received{animation:none!important}.edu-phase{opacity:0!important}.edu-three,.edu-received{opacity:1!important}.edu-draw{stroke-dashoffset:0!important}}
</style>
<rect x="0" y="0" width="800" height="520" fill="none"/><rect x="32" y="32" width="4" height="60" fill="#257664"/>
<text x="52" y="58" class="head">Управляемое отражение сигнала</text><text x="52" y="88" class="muted">RIS создаёт дополнительный путь между передатчиком и приёмником</text>

<path d="M138 339L682 339" style="stroke:#a7b9b1;stroke-dasharray:5 6"/><rect x="368" y="283" width="50" height="105" fill="#d7dcd4" stroke="#536c70"/><text x="393" y="278" text-anchor="middle" class="muted">Препятствие</text><rect x="443" y="152" width="164" height="62" rx="4" fill="#dce8e1" stroke="#183841"/><rect x="450" y="159" width="20" height="20" rx="2" fill="#257664"/><rect x="475" y="159" width="20" height="20" rx="2" fill="#257664"/><rect x="500" y="159" width="20" height="20" rx="2" fill="#257664"/><rect x="525" y="159" width="20" height="20" rx="2" fill="#257664"/><rect x="550" y="159" width="20" height="20" rx="2" fill="#257664"/><rect x="575" y="159" width="20" height="20" rx="2" fill="#257664"/><rect x="450" y="184" width="20" height="20" rx="2" fill="#257664"/><rect x="475" y="184" width="20" height="20" rx="2" fill="#257664"/><rect x="500" y="184" width="20" height="20" rx="2" fill="#257664"/><rect x="525" y="184" width="20" height="20" rx="2" fill="#257664"/><rect x="550" y="184" width="20" height="20" rx="2" fill="#257664"/><rect x="575" y="184" width="20" height="20" rx="2" fill="#257664"/><path d="M142 330L512 217" class="signal" marker-end="url(#arrow)"/><path d="M531 219L674 329" class="signal" marker-end="url(#arrow)"/><path d="M138 313L138 376" /><path d="M122 376L154 376" /><circle cx="138" cy="314" r="6" style="fill:#183841"/><rect x="674" y="318" width="28" height="47" rx="5" fill="#fff" stroke="#183841"/><path d="M683 356L693 356" /><text x="525" y="135" text-anchor="middle" font-weight="700">Поверхность RIS</text><text x="138" y="413" text-anchor="middle">Передатчик</text><text x="686" y="413" text-anchor="middle">Приёмник</text><g class="edu-phase edu-one" opacity="0" data-edu-state="0"><path d="M142 339H368" class="edu-bad" /><path d="M378 329L398 349M378 349L398 329" class="edu-bad" /><text x="400" y="430" class="edu-caption" text-anchor="middle" >Прямой путь перекрыт</text></g><g class="edu-phase edu-two" opacity="0" data-edu-state="1"><rect x="450" y="159" width="20" height="20" rx="2" class="edu-fill"/><rect x="475" y="159" width="20" height="20" rx="2" class="edu-alt"/><rect x="500" y="159" width="20" height="20" rx="2" class="edu-fill"/><rect x="525" y="159" width="20" height="20" rx="2" class="edu-alt"/><rect x="550" y="159" width="20" height="20" rx="2" class="edu-fill"/><rect x="575" y="159" width="20" height="20" rx="2" class="edu-alt"/><rect x="450" y="184" width="20" height="20" rx="2" class="edu-fill"/><rect x="475" y="184" width="20" height="20" rx="2" class="edu-alt"/><rect x="500" y="184" width="20" height="20" rx="2" class="edu-fill"/><rect x="525" y="184" width="20" height="20" rx="2" class="edu-alt"/><rect x="550" y="184" width="20" height="20" rx="2" class="edu-fill"/><rect x="575" y="184" width="20" height="20" rx="2" class="edu-alt"/><text x="400" y="430" class="edu-caption" text-anchor="middle" >Настраиваем поверхность</text></g><g class="edu-phase edu-three" opacity="1" data-edu-state="2"><rect x="450" y="159" width="20" height="20" rx="2" class="edu-fill"/><rect x="475" y="159" width="20" height="20" rx="2" class="edu-alt"/><rect x="500" y="159" width="20" height="20" rx="2" class="edu-fill"/><rect x="525" y="159" width="20" height="20" rx="2" class="edu-alt"/><rect x="550" y="159" width="20" height="20" rx="2" class="edu-fill"/><rect x="575" y="159" width="20" height="20" rx="2" class="edu-alt"/><rect x="450" y="184" width="20" height="20" rx="2" class="edu-fill"/><rect x="475" y="184" width="20" height="20" rx="2" class="edu-alt"/><rect x="500" y="184" width="20" height="20" rx="2" class="edu-fill"/><rect x="525" y="184" width="20" height="20" rx="2" class="edu-alt"/><rect x="550" y="184" width="20" height="20" rx="2" class="edu-fill"/><rect x="575" y="184" width="20" height="20" rx="2" class="edu-alt"/><path d="M142 330L522 217L674 329" class="edu-active" /><circle cx="688" cy="341" r="7" class="edu-good"/><text x="400" y="430" class="edu-caption" text-anchor="middle" >Сигнал приходит через RIS</text></g>
<path d="M40 449L760 449" style="stroke:#ccd9d3"/><text x="40" y="483" class="small">Прямой путь перекрыт · сигнал проходит через RIS</text>
</svg>
