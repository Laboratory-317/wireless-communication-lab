name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Monday 03:23 UTC = Monday 10:23 Asia/Tomsk (GitHub may delay the start).
    - cron: '23 3 * * 1'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Test project utilities
        run: node tools/project.cjs test

      - name: Synchronize recent Google Scholar publications
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        run: node tools/project.cjs scholar:sync

      - name: Read Quarto version
        id: quarto
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + require('node:fs').readFileSync('.quarto-version', 'utf8').trim() + '\n')"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ steps.quarto.outputs.version }}

      - name: Build both designs
        run: node tools/project.cjs build

      - name: Validate both designs
        run: node tools/project.cjs check

      - name: Save validated publication additions
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        run: |
          git add content/publications/ru.md content/publications/en.md quarto-site/ru/publications.qmd quarto-site/en/publications.qmd data/scholar-pending.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update recent publications from Google Scholar'
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
